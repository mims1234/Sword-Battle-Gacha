<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <meta name="theme-color" content="#0c090a" />
        <title>Idle Blade Master</title>
        <link rel="manifest" href="manifest.json" />
        <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="css/game.css?v=4.15" />
    </head>
    <body>
        <div id="boot" class="boot">
            <div class="boot-mark">ᛟ</div>
            <h1>Idle Blade Master</h1>
            <p id="bootHint">Loading the dungeon</p>
            <small id="bootGfx" class="bootgfx"></small>
        </div>

        <div id="app" class="app">
            <header id="top" class="top">
                <button class="floor" data-act="open" data-p="journal" title="Quests">
                    <b id="floorNo">Floor 1</b>
                    <span id="biome">Goblin Warrens</span>
                    <span class="pips" id="pips"></span>
                </button>
                <nav id="deskNav" class="desknav" aria-label="Screens"></nav>
                <div class="cur">
                    <span class="c-gold" title="Gold: level up your team"><i class="ic gold"></i><b id="souls">0</b></span>
                    <button class="c-gem" data-act="open" data-p="forge" title="Gems: summon new blades"><i class="ic gem"></i><b id="sigils">0</b></button>
                    <span class="c-ess" id="embWrap" title="Essence: rebirth upgrades" hidden><i class="ic ess"></i><b id="embers">0</b></span>
                </div>
                <button class="omen" id="omenBtn" data-act="omenInfo" title="Event candle" aria-label="Event candle"><span class="wick"></span><span class="flame" id="flame"></span></button>
                <button class="iconbtn" data-act="open" data-p="more" aria-label="Menu">☰</button>
            </header>

            <main id="main" class="main">
                <aside id="left" class="dock"></aside>

                <section id="center" class="center">
                    <div id="stageWrap" class="stagewrap">
                        <canvas id="stage"></canvas>
                        <div class="mutes"><button class="mute" id="musicBtn" data-act="muteMusic" aria-label="Music on or off" title="Music on/off">♪</button><button class="mute" id="sfxBtn" data-act="muteSfx" aria-label="Sound effects on or off" title="Sound effects on/off">FX</button><button class="mute" data-act="open" data-p="settings" aria-label="Volume settings" title="Volume settings">⚙</button><button class="mute gfxb" id="gfxBtn" data-act="gfxCycle" aria-label="Graphics quality: tap to change" title="Graphics quality: tap to change">HI</button></div>
                        <div id="bossBar" class="bossbar" hidden><span id="bossName"></span><div><i id="bossFill"></i></div></div>
                        <div id="status" class="status"></div>
                        <div id="advice" class="advice" hidden></div>
                        <div id="toasts" class="toasts"></div>
                    </div>
                    <div id="lower" class="lower">
                        <div id="band" class="band"></div>
                        <div id="ctl" class="ctl"></div>
                        <div id="info" class="info"></div>
                        <div id="sheet" class="sheet" hidden>
                            <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="iconbtn help" data-act="help" aria-label="How this works">?</button><button class="iconbtn" data-act="close" aria-label="Close">✕</button></div>
                            <div class="sheet-body" id="sheetBody"></div>
                        </div>
                    </div>
                </section>

                <aside id="right" class="dock"></aside>
            </main>

            <nav id="tabs" class="tabs" aria-label="Screens">
                <button data-act="close" data-tab="descent"><i>⚔</i>Battle</button>
                <button data-act="open" data-p="warband" data-tab="warband"><i>⛨</i>Team</button>
                <button data-act="open" data-p="forge" data-tab="forge"><i>◆</i>Summon<em id="forgeDot" hidden></em></button>
                <button data-act="open" data-p="journal" data-tab="journal"><i>✎</i>Quests<em id="journalDot" hidden></em></button>
                <button data-act="open" data-p="more" data-tab="more"><i>☰</i>More</button>
            </nav>

            <div id="summon" class="smview" hidden></div>
            <div id="coach" class="coach" hidden></div>
            <div id="guide" class="guide" hidden></div>
            <div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>
        </div>

        <script src="js/data.swords.js?v=4.15"></script>
        <script src="js/data.monsters.js?v=4.15"></script>
        <script src="js/data.game.js?v=4.15"></script>
        <script src="js/state.js?v=4.15"></script>
        <script src="js/sim.js?v=4.15"></script>
        <script src="js/render.js?v=4.15"></script>
        <script src="assets/music/tracks.js?v=4.15"></script>
        <script src="assets/sfx/sfx.js?v=4.15"></script>
        <script src="js/audio.js?v=4.15"></script>
        <script src="js/ui.js?v=4.15"></script>
        <script src="js/guide.js?v=4.15"></script>
        <script src="js/main.js?v=4.15"></script>
    </body>
</html>
